<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <title>Control de Cafetería Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Syne:wght@700;800&family=Share+Tech+Mono&family=Rubik+Mono+One&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <style>
        @keyframes bounce-retro {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-15px); }
        }
        @keyframes blink-retro {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
      </style>
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fce7f3; background-image: radial-gradient(#38bdf8 1.5px, transparent 1.5px), radial-gradient(#f43f5e 1.5px, #fce7f3 1.5px); background-size: 32px 32px; background-position: 0 0, 16px 16px; font-family: 'Syne', sans-serif;">
        <div style="background-color: #ffffff; border: 3px solid #000000; box-shadow: 6px 6px 0px 0px #000000; border-radius: 12px; padding: 2.5rem 3rem; display: flex; flex-direction: column; align-items: center;">
          <div style="font-size: 4rem; animation: bounce-retro 1s ease-in-out infinite;">☕</div>
          <h1 style="font-weight: 800; font-size: 1.8rem; margin-top: 1.5rem; color: #000; animation: blink-retro 1.5s infinite; letter-spacing: 0.05em;">CARGANDO...</h1>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
